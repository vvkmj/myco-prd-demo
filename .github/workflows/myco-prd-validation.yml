name: Myco PRD Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  validate-prd:
    name: Myco PRD Validation & Merge Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies & Run App Tests
        run: |
          npm ci || npm install
          npm test

      - name: Checkout Myco Validator (PR #5)
        uses: actions/checkout@v4
        with:
          repository: MycoIntelligence/Myco-backend
          ref: feat/prd-validation
          token: ${{ secrets.MYCO_PAT }}
          path: .myco-validator

      - name: Run Myco PRD Validation
        working-directory: .myco-validator
        env:
          GITHUB_TOKEN: ${{ secrets.MYCO_PAT }}
          PRD_VALIDATION: "true"
          PRD_FAIL_ON_INCONCLUSIVE: "true"
          PRD_FAIL_ON_MISSING_CREDS: "true"
          GATE_MIN_SEVERITY: "P1"
          CI_GATE: "true"
          LLM_PROVIDER: "openai"
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          echo "Installing Myco validator dependencies..."
          npm ci
          echo "Executing Myco PRD validation against PR #5 implementation..."
          npx ts-node src/validatorCli.ts --pr-url "${{ github.event.pull_request.html_url }}"
